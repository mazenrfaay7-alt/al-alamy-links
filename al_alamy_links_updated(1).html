<title>العالمي ✂️✂️😎 | روابط التواصل</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;
font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#374151,#090d16 65%);
color:#fff;padding:24px}.card{width:min(100%,420px);text-align:center;padding:30px 24px 26px;
border:1px solid #ffffff25;border-radius:28px;background:#ffffff0d;backdrop-filter:blur(12px);
box-shadow:0 22px 70px #0008}.photo{width:142px;height:142px;object-fit:cover;border-radius:50%;
border:4px solid #d6b36a;box-shadow:0 8px 30px #0008}.name{font-size:27px;margin:18px 0 8px}
.sub{color:#cbd5e1;margin:0 0 24px;font-size:14px}.links{display:grid;gap:13px}
a{display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;
color:#fff;font-weight:bold;padding:16px;border-radius:15px;font-size:17px;transition:transform .15s;
box-shadow:0 8px 20px #0003}
a:active{transform:scale(.98)}
.fb{background:#1877F2}.tt{background:#050505;border:1px solid #333}
.wa{background:#20b85a}
.social-icon{width:25px;height:25px;flex:0 0 25px;display:inline-flex;align-items:center;justify-content:center}
.social-icon svg{width:100%;height:100%;display:block;fill:currentColor}
.post{margin-top:22px;padding:17px 14px;border:1px solid #d6b36a88;border-radius:18px;
background:linear-gradient(145deg,#ffffff13,#00000025);box-shadow:inset 0 1px #ffffff12}
.post-title{margin:0 0 10px;color:#f4d48b;font-size:22px;font-weight:800;letter-spacing:.3px}
.post p{margin:7px 0;color:#fff;font-size:16px;font-weight:700;line-height:1.7}
.foot{color:#94a3b8;font-size:12px;margin-top:22px}
</style>
